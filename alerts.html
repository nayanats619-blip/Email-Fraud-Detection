<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alerts - Fraud Detection</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        .alerts-list {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
        }
        .alert-card {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.1), rgba(239, 68, 68, 0.05));
            border: 2px solid #ef4444;
            border-radius: 12px;
            padding: 1.5rem;
            backdrop-filter: blur(10px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .alert-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(239, 68, 68, 0.3);
        }
        .alert-card h3 {
            color: #ef4444;
            margin-bottom: 0.5rem;
            font-size: 1.2rem;
        }
        .alert-card p {
            margin: 0.3rem 0;
            color: #e5e7eb;
            font-size: 0.95rem;
        }
        .alert-card strong {
            color: #f3f4f6;
        }
        .controls {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }
        .controls button {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .controls button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(59, 130, 246, 0.4);
        }
        .no-alerts {
            text-align: center;
            padding: 3rem 1rem;
            color: #10b981;
            font-size: 1.1rem;
        }

        /* Go Back Button Styling */
        .back-btn-container {
            padding: 20px;
        }
        .back-btn {
            background: linear-gradient(135deg, #6b7280, #374151);
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
        }
        .back-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

<!-- Go Back Button -->
<div class="back-btn-container">
    <button onclick="window.location.href='/'" class="back-btn">⬅ Go Back</button>
</div>

<!-- Header -->
<div class="header">
    <h1>Fraud Alerts</h1>
</div>

<div class="container">
    <p>High-risk and suspicious emails detected</p>

    <div class="controls">
        <button onclick="loadAlerts()">Refresh Alerts</button>
    </div>

    <div id="alertsList" class="alerts-list"></div>
</div>

<script src="/alerts.js"></script>

</body>
</html>
